# Roam reply checks against the LOCAL app. Run: npm run eval:roam (see README.md).
# Cases are built from dimensions in cases.cjs; checks are in assertions.cjs. No judge model is called.
description: Roam chat replies - grounding, safety, language, length, tone
prompts:
  - "{{message}}"
providers:
  - id: file://provider.cjs
    label: roam-local
tests: file://cases.cjs
