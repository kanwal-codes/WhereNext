<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My bookings — BookMyGranthi</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="bookings">
<a class="skip" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">
  <div class="container mid">
    <header class="page-head">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>My bookings</span></nav>
      <h1 style="font-size:clamp(2.2rem,4.6vw,3.4rem)">My bookings</h1>
      <p class="lead" style="max-width:56ch">Requests made on this device appear here. Have a reference from another device? Look it up below.</p>
    </header>

    <div id="list" style="margin-bottom:56px"></div>

    <section class="panel pad" style="margin-bottom:96px">
      <h2 style="font-size:1.6rem;margin-bottom:6px">Find a booking</h2>
      <p class="muted small" style="margin-bottom:20px">Enter your reference and the email you booked with.</p>
      <form id="lookup" class="form-grid" novalidate style="align-items:end">
        <div class="field"><label for="l-ref">Reference</label><input class="input" id="l-ref" placeholder="BMG-XXXXXX" data-req autocapitalize="characters"><span class="error" role="alert">Enter your reference.</span></div>
        <div class="field"><label for="l-email">Email</label><input class="input" id="l-email" type="email" data-req autocomplete="email"><span class="error" role="alert">Enter a valid email.</span></div>
        <div class="full row wrap" style="--gap:14px"><button class="btn btn-primary" type="submit">Find booking</button><span class="small" id="l-msg" role="status"></span></div>
      </form>
    </section>
  </div>
</main>

<div id="site-footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/pages/bookings.js"></script>
</body>
</html>
